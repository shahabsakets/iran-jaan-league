async function cloudSave(){if(!onlineDB||!onlineAuth.currentUser)return;clearTimeout(cloudTimer);const snapshot=JSON.parse(JSON.stringify(S));cloudTimer=setTimeout(async()=>{try{cloudBusy=true;await onlineDB.collection('public').doc('league').set({state:JSON.stringify(snapshot),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:onlineAuth.currentUser.uid});lastCloudTs=snapshot.ts;onlineMessage('✅ تغییرات آنلاین منتشر شد')}catch(e){onlineMessage('❌ ذخیره آنلاین ناموفق: '+e.message)}finally{cloudBusy=false}},450)}
